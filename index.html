<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css"/>
    <script>
        function test1(data){
            let inp2 = parseFloat(prompt("Enter Number: "));
            let tot = data + inp2;
            alert(`Value is: ${tot}`);
            let d2 = document.getElementById("h1id").innerHTML;
            document.getElementById("h1id").innerHTML = d2+" Modified";
            document.getElementById("did").innerHTML=`<h2>${d2}</h2>`
        }

    </script>
</head>
<body>
    <h1 id="h1id">WDDM130</h1>
    <div id="did"></div>
    <input type="button" value="Submit" id="but" onclick="test1(5)"/>

</body>
</html>
